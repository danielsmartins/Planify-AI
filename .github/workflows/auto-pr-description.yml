name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  describe-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PR Description via Gemini API
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (!process.env.GEMINI_API_KEY) {
              console.log('GEMINI_API_KEY não configurada nos secrets. Pulando geração.');
              return;
            }

            const pullNumber = context.payload.pull_request.number;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const prTitle = context.payload.pull_request.title;

            // Obter diff do Pull Request
            const { data: diffData } = await github.rest.pulls.get({
              owner: repoOwner,
              repo: repoName,
              pull_number: pullNumber,
              mediaType: {
                format: 'diff'
              }
            });

            // Limitar tamanho do diff para envio
            const truncatedDiff = typeof diffData === 'string' 
              ? diffData.slice(0, 12000) 
              : JSON.stringify(diffData).slice(0, 12000);

            const prompt = `Você é um assistente de desenvolvimento sênior especialista em Pull Requests.
Com base no título e no diff de alterações abaixo, gere uma descrição clara, profissional e estruturada em Português (Brasil) para este Pull Request.

Título do PR: ${prTitle}

Diff das alterações:
\`\`\`diff
${truncatedDiff}
\`\`\`

Responda diretamente com a descrição em formato Markdown utilizando a seguinte estrutura (não envolva tudo em bloco de código):

## 📌 Resumo das Alterações
[Tópicos principais explicando o que foi alterado ou adicionado]

## 🛠️ Modificações Técnicas
[Destaque dos componentes ou arquivos alterados e motivos técnicos]

## 🧪 Como Testar
[Passos diretos para validação das alterações]
`;

            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    parts: [{ text: prompt }]
                  }]
                })
              });

              if (!res.ok) {
                const errText = await res.text();
                console.error('Erro na chamada da API Gemini:', res.status, errText);
                return;
              }

              const data = await res.json();
              const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text;

              if (generatedText) {
                await github.rest.pulls.update({
                  owner: repoOwner,
                  repo: repoName,
                  pull_number: pullNumber,
                  body: generatedText
                });
                console.log('Descrição do PR gerada e atualizada com sucesso pelo Gemini!');
              } else {
                console.log('Nenhum texto gerado pela API Gemini.');
              }
            } catch (err) {
              console.error('Erro ao atualizar PR com Gemini:', err);
            }
